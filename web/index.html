<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Organizador</title>
  <meta name="description" content="Calendario, tareas diarias y tareas puntuales, con alarmas." />
  <meta name="theme-color" content="#0b0d13" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Organizador" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-180.png" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1 id="view-title">Hoy</h1>
      <div class="topbar-actions" id="topbar-actions"></div>
    </div>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <button id="fab" class="fab" type="button" aria-label="Añadir">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
  </button>

  <nav class="tabbar" id="tabbar" role="tablist">
    <button class="tab" data-tab="hoy" role="tab" aria-selected="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/></svg>
      <span>Hoy</span>
    </button>
    <button class="tab" data-tab="calendario" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Calendario</span>
    </button>
    <button class="tab" data-tab="tareas" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7l2.5 2.5L11 5"/><path d="M4 17l2.5 2.5L11 15"/><path d="M14 8h6M14 18h6"/></svg>
      <span>Tareas</span>
    </button>
    <button class="tab" data-tab="rutinas" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4h-4"/></svg>
      <span>Diarias</span>
    </button>
    <button class="tab" data-tab="ajustes" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
      <span>Ajustes</span>
    </button>
  </nav>

  <div id="sheet-root"></div>
  <div id="alarm-root"></div>
  <div id="toast-root" class="toast-root" aria-live="assertive"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
