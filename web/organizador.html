<style>
/* ---------- Base ---------- */

:root {
  --bg: #f4f5f9;
  --surface: #ffffff;
  --surface-2: #eceef5;
  --text: #14161c;
  --muted: #6b7180;
  --line: #dfe2ec;
  --accent: #4c6ef5;
  --accent-soft: #e6ebff;
  --danger: #e03131;
  --ok: #2f9e44;
  --warn: #e8590c;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(16, 20, 40, .06), 0 8px 24px rgba(16, 20, 40, .07);
  --tabbar-h: 58px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);

  --c-blue: #4c6ef5;
  --c-violet: #7950f2;
  --c-green: #2f9e44;
  --c-orange: #f76707;
  --c-pink: #e64980;
  --c-teal: #0ca678;
  --c-gray: #868e96;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0d13;
    --surface: #151824;
    --surface-2: #1e2231;
    --text: #e9ecf5;
    --muted: #8d93a6;
    --line: #262b3b;
    --accent: #748ffc;
    --accent-soft: #1e2440;
    --danger: #ff6b6b;
    --ok: #51cf66;
    --warn: #ff922b;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);

    --c-blue: #748ffc;
    --c-violet: #9775fa;
    --c-green: #51cf66;
    --c-orange: #ff922b;
    --c-pink: #f783ac;
    --c-teal: #38d9a9;
    --c-gray: #909296;
  }
}

/* El visor de artifacts marca el tema en la raíz; debe ganar a la preferencia
   del sistema en los dos sentidos, así que ambos temas se declaran explícitos. */
:root[data-theme="dark"] {
  --bg: #0b0d13;
  --surface: #151824;
  --surface-2: #1e2231;
  --text: #e9ecf5;
  --muted: #8d93a6;
  --line: #262b3b;
  --accent: #748ffc;
  --accent-soft: #1e2440;
  --danger: #ff6b6b;
  --ok: #51cf66;
  --warn: #ff922b;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);

  --c-blue: #748ffc;
  --c-violet: #9775fa;
  --c-green: #51cf66;
  --c-orange: #ff922b;
  --c-pink: #f783ac;
  --c-teal: #38d9a9;
  --c-gray: #909296;
}

:root[data-theme="light"] {
  --bg: #f4f5f9;
  --surface: #ffffff;
  --surface-2: #eceef5;
  --text: #14161c;
  --muted: #6b7180;
  --line: #dfe2ec;
  --accent: #4c6ef5;
  --accent-soft: #e6ebff;
  --danger: #e03131;
  --ok: #2f9e44;
  --warn: #e8590c;
  --shadow: 0 1px 2px rgba(16, 20, 40, .06), 0 8px 24px rgba(16, 20, 40, .07);
  --c-blue: #4c6ef5;
  --c-violet: #7950f2;
  --c-green: #2f9e44;
  --c-orange: #f76707;
  --c-pink: #e64980;
  --c-teal: #0ca678;
  --c-gray: #868e96;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}

body {
  padding-bottom: calc(var(--tabbar-h) + var(--safe-b));
  min-height: 100vh;
}

svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

button { font: inherit; color: inherit; cursor: pointer; }

h1, h2, h3 { margin: 0; font-weight: 650; letter-spacing: -.01em; }

/* ---------- Barra superior ---------- */

.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  padding-top: var(--safe-t);
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--line);
}

.topbar-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 16px;
  min-height: 52px;
}

.topbar h1 { font-size: 22px; }

.topbar-actions { display: flex; gap: 6px; align-items: center; }

.icon-btn {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--surface);
}

.icon-btn:active { transform: scale(.94); }

/* ---------- Contenido ---------- */

.view { padding: 14px 16px 108px; max-width: 780px; margin: 0 auto; }

.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 22px 2px 10px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
}

.section-title:first-child { margin-top: 4px; }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.empty {
  padding: 26px 18px;
  text-align: center;
  color: var(--muted);
  font-size: 15px;
}

.empty strong { display: block; color: var(--text); margin-bottom: 4px; font-weight: 600; }

/* ---------- Filas de elementos ---------- */

.row {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  position: relative;
}

.row:last-child { border-bottom: none; }

.row-bar {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--dot, var(--c-blue));
}

.check {
  flex: none;
  width: 24px;
  height: 24px;
  margin-top: 1px;
  border-radius: 50%;
  border: 2px solid var(--line);
  background: transparent;
  display: grid;
  place-items: center;
  padding: 0;
}

.check svg { width: 14px; height: 14px; stroke-width: 3; opacity: 0; }

function permissionHint(permission) {

  const file = new File([content], filename, { type: 'text/calendar' });

  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: getSettings().calendarName });
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') return;
      console.warn('No se pudo compartir:', err);
    }
  }
  download(filename, content, 'text/calendar');
